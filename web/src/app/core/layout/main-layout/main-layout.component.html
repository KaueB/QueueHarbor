<div class="flex h-screen bg-background w-full font-sans text-foreground transition-colors duration-300">
  
  <aside class="w-64 border-r border-border bg-card hidden md:flex flex-col">
    <div class="h-16 flex items-center px-6 border-b border-border">
      <i class="pi pi-box mr-3 text-xl"></i>
      <h2 class="text-lg font-bold tracking-tight">QueueHarbor</h2>
    </div>

    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <a 
        routerLink="/dashboard" 
        routerLinkActive="bg-muted font-medium"
        [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center px-3 py-2.5 text-sm rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
        <i class="pi pi-server mr-3"></i> 
        Filas BullMQ
      </a>
    </nav>

    <div class="p-4 border-t border-border">
      <button 
        (click)="onLogout()" 
        class="flex w-full items-center px-3 py-2 text-sm font-medium rounded-md text-muted-foreground hover:bg-red-500/10 hover:text-red-500 transition-colors">
        <i class="pi pi-sign-out mr-3"></i> 
        Sair
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <header class="h-16 border-b border-border bg-card flex items-center justify-between px-6 lg:px-8">
      
      <div class="md:hidden flex items-center font-bold tracking-tight">
        <i class="pi pi-box mr-2"></i> QueueHarbor
      </div>

      <div class="hidden md:block flex-1"></div>

      <div class="flex items-center space-x-4">
        
        <button 
          (click)="themeService.toggleTheme()" 
          class="inline-flex items-center justify-center h-9 w-9 rounded-md transition-colors hover:bg-muted text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
          <i class="pi text-lg" [class.pi-moon]="!themeService.isDarkMode()" [class.pi-sun]="themeService.isDarkMode()"></i>
        </button>

        @if (user()) {
          <div class="flex items-center space-x-3 border-l border-border pl-4">
            <div class="flex flex-col text-right hidden sm:flex">
              <span class="text-sm font-medium leading-none">{{ user()?.email }}</span>
              <span class="text-xs text-muted-foreground mt-1">{{ user()?.role }}</span>
            </div>
            <div class="h-9 w-9 rounded-full bg-primary flex items-center justify-center text-primary-foreground text-sm font-medium select-none">
              {{ userInitial() }}
            </div>
          </div>
        }
      </div>
    </header>

    <main class="flex-1 overflow-auto bg-muted/30 p-6 lg:p-8">
      <div class="mx-auto max-w-7xl">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
