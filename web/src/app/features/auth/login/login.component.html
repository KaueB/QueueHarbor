<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="flex flex-col space-y-2 text-center mb-6">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Bem-vindo de volta</h1>
      <p class="text-sm text-slate-500">Insira seu e-mail e senha para acessar o painel</p>
    </div>

    <form class="space-y-4" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="space-y-2">
        <label for="email" class="text-sm font-medium leading-none text-slate-700">E-mail</label>
        <input
          id="email"
          type="email"
          pInputText
          placeholder="admin@quereharbor.local"
          class="w-full"
          formControlName="email"
        />
      </div>

      <div class="space-y-2">
        <label for="password" class="text-sm font-medium leading-none text-slate-700">Senha</label>
        <p-password
          id="password"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="••••••••"
          styleClass="w-full"
          formControlName="password"
        ></p-password>
      </div>

      <p-button
        label="Entrar"
        styleClass="mt-6 w-full"
        [disabled]="loginForm.invalid || isLoading"
        type="submit"
      ></p-button>
    </form>

    <p *ngIf="errorMessage" class="mt-4 text-sm text-red-500 text-center">
      {{ errorMessage }}
    </p>

    <div class="mt-4 text-center text-sm text-slate-500">Repositório Open Source</div>
  </div>
</div>
