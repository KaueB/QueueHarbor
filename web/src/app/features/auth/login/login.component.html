<div class="min-h-screen flex items-center justify-center bg-background px-4">
  
  <div class="w-full max-w-sm rounded-xl border border-border bg-card text-card-foreground shadow-lg px-6 py-8">
    
    <div class="flex flex-col space-y-2 text-center mb-8">
      <h3 class="font-semibold tracking-tight text-2xl text-foreground">Login na sua conta</h3>
      <p class="text-sm text-muted-foreground">
        Insira seu e-mail abaixo para acessar o painel
      </p>
    </div>

    <div class="space-y-6">
      <form class="grid gap-4" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <div class="grid gap-2">
          <label for="email" class="text-sm font-medium leading-none text-foreground peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
            Email
          </label>
          <input
            id="email"
            type="email"
            pInputText
            placeholder="m@example.com"
            formControlName="email"
            required
            class="h-10 border-border bg-background"
          />
        </div>

        <div class="grid gap-2">
          <div class="flex items-center">
            <label for="password" class="text-sm font-medium leading-none text-foreground peer-disabled:cursor-not-allowed peer-disabled:opacity-70">
              Senha
            </label>
            <a href="#" class="ml-auto inline-block text-xs underline-offset-4 hover:underline text-muted-foreground hover:text-foreground">
              Esqueceu sua senha?
            </a>
          </div>
          <p-password
            id="password"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            formControlName="password"
          ></p-password>
        </div>

        <p-button
          label="Login"
          [disabled]="loginForm.invalid || isLoading"
          type="submit"
          styleClass="w-full bg-primary text-primary-foreground hover:bg-primary/90 transition-colors h-10 font-semibold"
        ></p-button>

        <button type="button" class="inline-flex h-10 items-center justify-center whitespace-nowrap rounded-md border border-input bg-transparent px-4 py-2 text-sm font-medium shadow-sm transition-colors hover:bg-muted hover:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 w-full">
          Login with Google
        </button>
      </form>

      @if (errorMessage) {
        <p class="mt-4 text-sm text-red-500 font-medium text-center">
          {{ errorMessage }}
        </p>
      }

      <div class="mt-4 text-center text-sm text-muted-foreground">
        Não tem uma conta? <a href="#" class="underline underline-offset-4 text-foreground font-medium">Cadastre-se</a>
      </div>
    </div>
  </div>
</div>
