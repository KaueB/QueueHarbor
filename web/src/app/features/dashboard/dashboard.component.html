<div class="space-y-8 pb-8">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-foreground">Dashboard</h1>
      <p class="text-muted-foreground mt-1">Bem-vindo de volta! Aqui está o resumo das suas filas.</p>
    </div>
    <div class="flex items-center gap-3">
      <button class="inline-flex items-center justify-center rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm hover:bg-primary/90 transition-all hover:scale-[1.02] active:scale-[0.98] gap-2">
        <lucide-icon name="server" class="w-4 h-4"></lucide-icon>
        Nova Fila
      </button>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-4 mb-10">
    <app-stat-card
      title="Total de Jobs"
      [value]="stats().totalJobs"
      icon="box"
      description="+12% desde ontem"
    ></app-stat-card>
    <app-stat-card
      title="Ativos agora"
      [value]="stats().activeNow"
      icon="server"
      description="Processamento normal"
    ></app-stat-card>
    <app-stat-card
      title="Concluídos (24h)"
      [value]="stats().completed24h"
      icon="check-circle"
      description="Taxa de sucesso: 98%"
    ></app-stat-card>
    <app-stat-card
      title="Sistemas em Erro"
      [value]="stats().errorSystems"
      icon="alert-circle"
      description="Requer atenção imediata"
    ></app-stat-card>
  </div>

  <!-- Queue Table with @defer -->
  <div class="space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold tracking-tight text-foreground flex items-center gap-2">
        <lucide-icon name="inbox" class="w-5 h-5 text-primary"></lucide-icon>
        Gerenciamento de Filas
      </h2>
    </div>

    @defer (on idle) {
      <app-queue-table [queues]="mockQueues()"></app-queue-table>
    } 
    @placeholder (minimum 800ms) {
      <div class="w-full bg-card border border-border rounded-2xl overflow-hidden p-8 animate-pulse">
        <div class="h-8 w-1/4 bg-muted rounded-md mb-6"></div>
        <div class="space-y-4">
          <div class="h-12 w-full bg-muted/50 rounded-xl"></div>
          <div class="h-12 w-full bg-muted/50 rounded-xl"></div>
          <div class="h-12 w-full bg-muted/50 rounded-xl"></div>
          <div class="h-12 w-full bg-muted/50 rounded-xl"></div>
        </div>
      </div>
    }
    @loading {
      <div class="flex flex-col items-center justify-center p-12 bg-card border border-border rounded-2xl border-dashed">
         <lucide-icon name="loader-2" class="w-8 h-8 animate-spin text-primary mb-4"></lucide-icon>
         <p class="text-sm font-medium text-muted-foreground">Carregando filas...</p>
      </div>
    }
  </div>
</div>
