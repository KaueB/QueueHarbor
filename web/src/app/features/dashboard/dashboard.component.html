<div class="space-y-6">
  <header>
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">
      Dashboard
    </h1>
    <p class="text-sm text-slate-500">
      Veja o que está acontecendo nas suas filas agora.
    </p>
  </header>
  
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
      <span class="text-sm font-medium text-slate-500">Filas Ativas</span>
      <p class="text-3xl font-bold text-slate-900 mt-2">0</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
      <span class="text-sm font-medium text-slate-500">Jobs Processados (24h)</span>
      <p class="text-3xl font-bold text-slate-900 mt-2">0</p>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
      <span class="text-sm font-medium text-slate-500">Workers Conectados</span>
      <p class="text-3xl font-bold text-slate-900 mt-2">0</p>
    </div>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl p-8 text-center">
    <div class="mx-auto w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center mb-4">
      <i class="pi pi-inbox text-slate-400 text-xl"></i>
    </div>
    <h3 class="text-slate-900 font-semibold mb-1">Nenhuma atividade recente</h3>
    <p class="text-sm text-slate-500">
      Conecte um worker ou adicione jobs para começar a ver métricas.
    </p>
  </div>
</div>
